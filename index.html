<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MewMuze</title>
    <style>
      /* The overlay window itself must be fully transparent; only the cat is drawn. */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* Do not show a text cursor / selection over the empty overlay. */
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      canvas {
        /* Crisp pixel-art: never let the browser smooth our sprites. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
