name: macOS

# The macOS port cannot be validated on a Windows machine: Apple's SDK, linker,
# codesign and hdiutil are macOS-only, and a `cargo check` for a Windows target
# never compiles a single line behind `#[cfg(target_os = "macos")]`. This
# workflow is therefore the ONLY place the macOS half of the codebase is
# actually compiled, so it deliberately builds on both architectures rather
# than assuming one implies the other.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are pure overhead in CI and bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # The shared frontend/core. Platform-independent by design, so it runs once
  # rather than once per architecture — and on the cheapest arm64 runner.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test 2>&1 | tee frontend-tests.log

      - name: Production frontend build
        # The Tauri build runs this too, but failing here points at the
        # frontend instead of burying a Vite error in a Rust build log.
        run: npm run build

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-logs
          path: frontend-tests.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The Rust/Tauri half, on both architectures GitHub currently hosts.
  #
  #   macos-14        -> Apple Silicon (arm64)
  #   macos-15-intel  -> Intel (x86_64); the macos-13 Intel image is retired
  #
  # Neither result implies the other: the two differ in ABI, in library
  # availability and in how Quartz reports geometry, which is exactly the class
  # of bug this port is most exposed to.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing must not cancel the other: knowing whether a
      # break is arch-specific is the whole point of this matrix.
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon (arm64)
            runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
          - name: Intel (x86_64)
            runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          # Deliberately NOT caching src-tauri/target: a stale target directory
          # is the classic way a real compile error gets masked, and this is the
          # only place the macOS code is ever compiled.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.runner }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.runner }}-cargo-registry-

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch PDFium
        # A declared bundle resource must exist BEFORE the Tauri build script
        # runs, so this is a build prerequisite rather than an optional extra.
        run: npm run fetch:pdfium

      - name: Verify PDFium is a real Mach-O with the slice this build needs
        run: |
          set -euo pipefail
          test -f src-tauri/lib/libpdfium.dylib
          file src-tauri/lib/libpdfium.dylib
          lipo -info src-tauri/lib/libpdfium.dylib
          # An Intel-only dylib inside an arm64 app loads on neither. Assert the
          # slice this architecture actually needs is present.
          lipo -info src-tauri/lib/libpdfium.dylib | grep -q '${{ matrix.arch }}' \
            || { echo "PDFium is missing the ${{ matrix.arch }} slice"; exit 1; }

      - name: Cache whisper-cli build
        uses: actions/cache@v4
        with:
          path: src-tauri/target/whisper-build
          key: whisper-cli-b4938-universal-${{ hashFiles('scripts/build-whisper-macos.sh') }}

      - name: Build whisper-cli (Local Voice, bundled)
        # whisper.cpp ships no macOS command-line build, so the app carries
        # its own: pinned b4938, universal, static, Metal shaders embedded.
        run: bash scripts/build-whisper-macos.sh

      - name: Clippy (macOS cfg branches included)
        # This is the first time anything compiles the macOS-only modules.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} 2>&1 | tee rust-tests-${{ matrix.arch }}.log

      - name: Real Local Chat runtime (download, verify, unpack, start)
        # The pinned llama.cpp macOS build for this architecture, through the
        # app's own downloader and extractor, then `llama-server --version`.
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} -- --ignored real_macos_chat_runtime --nocapture 2>&1 | tee -a rust-tests-${{ matrix.arch }}.log

      - name: Build .app and .dmg
        # Unsigned/ad-hoc. Signing and notarisation need Apple credentials that
        # deliberately do not exist in this repository; see docs/MACOS_PORT.md.
        # --config disables updater artifacts for CI. The repo config keeps
        # createUpdaterArtifacts on because a real release needs them, but
        # producing one makes Tauri sign it, and with a pubkey present and no
        # private key the build exits non-zero AFTER writing a perfectly good
        # .app and .dmg. The signing key is deliberately not in this repo.
        run: npm run tauri build -- --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Inspect the bundle
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/MewMuze Paper.app"
          test -d "$APP"
          echo "--- executable architecture ---"
          lipo -info "$APP/Contents/MacOS/MewMuzePaper"
          lipo -info "$APP/Contents/MacOS/MewMuzePaper" | grep -q '${{ matrix.arch }}' \
            || { echo "executable is not ${{ matrix.arch }}"; exit 1; }
          echo "--- required Info.plist keys ---"
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.spandan.pixelcat.paper"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Contents/Info.plist"
          echo "--- bundled whisper-cli ---"
          lipo -info "$APP/Contents/MacOS/whisper-cli"
          "$APP/Contents/MacOS/whisper-cli" --help > /dev/null
          echo "--- bundled PDFium ---"
          DYLIB=$(find "$APP" -name 'libpdfium.dylib' -print -quit)
          test -n "$DYLIB" || { echo "libpdfium.dylib is missing from the bundle"; exit 1; }
          file "$DYLIB"
          lipo -info "$DYLIB"
          echo "--- icon ---"
          ls "$APP/Contents/Resources/"*.icns
          echo "--- signature (expected: adhoc or none) ---"
          codesign -dv --verbose=2 "$APP" 2>&1 || true
          echo "--- size ---"
          du -sh "$APP"

      - name: Local Voice transcribes with the bundled engine
        # The exact arguments local_ai.rs passes, against the pinned model the
        # app downloads and whisper.cpp's own sample recording.
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/MewMuze Paper.app"
          MODEL="$RUNNER_TEMP/ggml-base-q8_0.bin"
          curl -sSfL -o "$MODEL" https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q8_0.bin
          echo "c577b9a86e7e048a0b7eada054f4dd79a56bbfa911fbdacf900ac5b567cbb7d9  $MODEL" | shasum -a 256 -c -
          OUT="$RUNNER_TEMP/jfk"
          # A CI virtual machine may not offer Metal; a real Mac does. Fall back to CPU only here.
          "$APP/Contents/MacOS/whisper-cli" -m "$MODEL" -f src-tauri/target/whisper-build/src/samples/jfk.wav \
              -l auto -t 3 -np -nt -oj -of "$OUT" \
            || "$APP/Contents/MacOS/whisper-cli" -m "$MODEL" -f src-tauri/target/whisper-build/src/samples/jfk.wav \
              -l auto -t 3 -np -nt -oj -of "$OUT" -ng
          cat "$OUT.json" | head -c 600
          grep -qi "ask not what your country" "$OUT.json" || { echo "transcript is wrong"; exit 1; }

      - name: Record artifact hashes
        run: |
          set -euo pipefail
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          shasum -a 256 "$B"/dmg/*.dmg | tee dmg-sha256-${{ matrix.arch }}.txt

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: MewMuze-Paper-macOS-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/MewMuze Paper.app
          if-no-files-found: error

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: MewMuze-Paper-macOS-DMG-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            dmg-sha256-${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-logs-${{ matrix.arch }}
          path: rust-tests-${{ matrix.arch }}.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # One app that runs natively on both architectures — what customers download.
  # ---------------------------------------------------------------------------
  universal:
    name: Universal (arm64 + x86_64)
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust with both Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-14-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-14-cargo-registry-

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch PDFium (universal)
        run: npm run fetch:pdfium

      - name: Cache whisper-cli build
        uses: actions/cache@v4
        with:
          path: src-tauri/target/whisper-build
          key: whisper-cli-b4938-universal-${{ hashFiles('scripts/build-whisper-macos.sh') }}

      - name: Build whisper-cli (Local Voice, bundled)
        # whisper.cpp ships no macOS command-line build, so the app carries
        # its own: pinned b4938, universal, static, Metal shaders embedded.
        run: bash scripts/build-whisper-macos.sh

      - name: PDFium must carry BOTH slices for a universal app
        run: |
          set -euo pipefail
          INFO=$(lipo -info src-tauri/lib/libpdfium.dylib)
          echo "$INFO"
          # A universal MewMuze with a single-architecture PDFium is not a valid
          # universal distribution: PDF tools would fail on half the machines.
          echo "$INFO" | grep -q 'arm64'  || { echo "PDFium missing arm64";  exit 1; }
          echo "$INFO" | grep -q 'x86_64' || { echo "PDFium missing x86_64"; exit 1; }

      - name: Build universal .app and .dmg
        # --config disables updater artifacts for CI. The repo config keeps
        # createUpdaterArtifacts on because a real release needs them, but
        # producing one makes Tauri sign it, and with a pubkey present and no
        # private key the build exits non-zero AFTER writing a perfectly good
        # .app and .dmg. The signing key is deliberately not in this repo.
        run: npm run tauri build -- --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify BOTH slices are present
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/MewMuze Paper.app"
          test -d "$APP"
          INFO=$(lipo -info "$APP/Contents/MacOS/MewMuzePaper")
          echo "$INFO"
          # "Universal" is asserted here, never assumed from the target name: a
          # missing slice installs fine and then fails to launch for half the
          # customers.
          echo "$INFO" | grep -q 'arm64'  || { echo "missing arm64 slice";  exit 1; }
          echo "$INFO" | grep -q 'x86_64' || { echo "missing x86_64 slice"; exit 1; }
          DYLIB=$(find "$APP" -name 'libpdfium.dylib' -print -quit)
          test -n "$DYLIB" || { echo "libpdfium.dylib missing from bundle"; exit 1; }
          lipo -info "$DYLIB"
          WINFO=$(lipo -info "$APP/Contents/MacOS/whisper-cli")
          echo "$WINFO"
          echo "$WINFO" | grep -q 'arm64'  || { echo "whisper-cli missing arm64";  exit 1; }
          echo "$WINFO" | grep -q 'x86_64' || { echo "whisper-cli missing x86_64"; exit 1; }
          du -sh "$APP"
          shasum -a 256 "src-tauri/target/universal-apple-darwin/release/bundle/dmg/"*.dmg \
            | tee dmg-sha256-universal.txt

      - name: Package the update archive (unsigned)
        # What the in-app updater downloads: the .app as a tar.gz. It is signed
        # OFF CI with MewMuze Paper's updater key (never stored here) - see
        # docs/MACOS_PORT.md, "Paper update channel".
        run: |
          set -euo pipefail
          B="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          tar -czf "MewMuze Paper.app.tar.gz" -C "$B" "MewMuze Paper.app"
          shasum -a 256 "MewMuze Paper.app.tar.gz" | tee -a dmg-sha256-universal.txt

      - name: Upload the update archive
        uses: actions/upload-artifact@v4
        with:
          name: MewMuze-Paper-macOS-update-universal
          path: MewMuze Paper.app.tar.gz
          if-no-files-found: error

      - name: Upload universal .app
        uses: actions/upload-artifact@v4
        with:
          name: MewMuze-Paper-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/MewMuze Paper.app
          if-no-files-found: error

      - name: Upload universal .dmg
        uses: actions/upload-artifact@v4
        with:
          name: MewMuze-Paper-macOS-DMG-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            dmg-sha256-universal.txt
          if-no-files-found: error
